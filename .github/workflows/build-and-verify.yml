name: Build and Verify ERP Modernization

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    # Restore dependencies for both projects
    - name: Restore Legacy Monolith
      run: dotnet restore legacy_onsight_erp_monolith/*.csproj

    - name: Restore Modern Cloud API
      run: dotnet restore modern_cloud_api/*.csproj

    # Build Legacy Monolith
    - name: Build Legacy Monolith
      run: dotnet build legacy_onsight_erp_monolith/*.csproj --no-restore --configuration Release

    # Build Modern Cloud API
    - name: Build Modern Cloud API
      run: dotnet build modern_cloud_api/*.csproj --no-restore --configuration Release